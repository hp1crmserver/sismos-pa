      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28' fill='none'%3E%3Crect x='1.5' y='1.5' width='25' height='25' rx='6' fill='%230F172A' stroke='%230EA5E9' stroke-width='1.8'/%3E%3Cpath d='M4.5 14.5h4.2l2.1-6.2 3.1 11.4 2.7-8.4 1.9 3.2h5' stroke='%2338BDF8' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>GeoAlert-pa — Monitor Sísmico IGC-UP · USGS · EMSC</title>
    <meta
      name="description"
      content="Plataforma de monitoreo sísmico en tiempo real para alertas, avisos y boletines del Instituto de Geociencias de la Universidad de Panamá (IGC-UP), USGS y EMSC."
    />
    <meta property="og:title" content="GeoAlert-pa — Monitor Sísmico IGC-UP · USGS · EMSC" />
    <meta
      property="og:description"
      content="Monitoreo sísmico en tiempo real con capas Esri, notificaciones visuales y auditivas, tarjetas 4:5 y exportación de reportes en PDF e imagen."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('sismo_theme') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#070B12] dark:text-slate-100 antialiased selection:bg-sky-500/20 selection:text-sky-600 dark:selection:text-sky-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
