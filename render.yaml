services:
  - type: web
    name: geoalert-pa
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.23.5"
